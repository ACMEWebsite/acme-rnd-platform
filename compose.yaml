services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    env_file: .env
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [internal]
  backend:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    depends_on:
      db: {condition: service_healthy}
    command: ["sh", "-c", "python manage.py migrate && python manage.py collectstatic --noinput && gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 600 --access-logfile - --error-logfile -"]
    volumes: ["django_static:/app/staticfiles"]
    expose: ["8000"]
    networks: [internal]
  web:
    build:
      context: .
      dockerfile: deployment/caddy/Dockerfile
    restart: unless-stopped
    environment:
      APP_HOST: ${APP_HOST:-localhost}
    depends_on: [backend]
    ports: ["80:80"]
    volumes:
      - caddy_data:/data
      - caddy_config:/config
      - django_static:/static:ro
    networks: [internal]
networks:
  internal: {driver: bridge}
volumes:
  postgres_data:
  django_static:
  caddy_data:
  caddy_config:
