services:
  - type: web
    name: acme-rnd-platform
    env: docker
    dockerfilePath: ./deployment/caddy/Dockerfile
    dockerContext: .
    plan: starter
    envVars:
      - key: APP_HOST
        value: 0.0.0.0
      - key: DATABASE_URL
        fromDatabase:
          name: acme-rnd-db
          property: connectionString
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_ALLOWED_HOSTS
        value: "*"

databases:
  - name: acme-rnd-db
    databaseName: acme_rnd
    user: acme_app
    plan: starter
